# Fly.io deployment for the SeoGrep MCP gateway (@pseo/mcp).
# First deploy is a human gate — see .github/workflows/deploy-mcp.yml
# (workflow_dispatch only). Secrets (SUPABASE_*) are set via `fly secrets`.
app = "seogrep-mcp"
primary_region = "nrt"

# No [build] section here by design: flyctl resolves [build] paths relative to
# this file's directory, so a manual `fly deploy` run from apps/mcp/ would use
# the wrong context/path. Deploys always run from the repo root with an
# explicit --dockerfile flag instead (see .github/workflows/deploy-mcp.yml):
#   flyctl deploy --config apps/mcp/fly.toml --dockerfile apps/mcp/Dockerfile
# Manual deploys must be run the same way, from the repo root.

# No DFS_BUDGET_DIR any more: the DataForSEO daily budget counter is no longer a file. It used to
# be JSONL under /tmp/dfs-spend, which meant each machine below carried its OWN per-boot $3/day
# (hostile audit H-03). It is now public.dfs_spend in Postgres (migration 0014) — one durable
# counter the whole fleet reserves against, reached with the SUPABASE_* secrets already set here.

# MODE selects the process role at runtime (see apps/mcp/src/index.ts). Both process groups run as
# SEPARATE machines, which is exactly why the spend counter must live in the database.
[processes]
  web = "sh -c 'MODE=web exec node apps/mcp/dist/index.js'"
  worker = "sh -c 'MODE=worker exec node apps/mcp/dist/index.js'"

# Public MCP endpoint. Always-on: auto-stop disabled, at least one machine.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# The worker process is the real pg-boss queue consumer: it processes every async
# job (crawl_site, audits, generate_report). Do NOT scale it to 0 — with no
# consumer, queued jobs silently pile up and never run. SIGTERM drains in-flight
# jobs gracefully (see apps/mcp/src/index.ts and apps/mcp/src/queue/worker.ts).
